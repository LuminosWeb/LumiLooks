name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publier une Release GitHub (étiquette v<version de package.json>)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app
          - label: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app
          - label: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: FFmpeg sidecar
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release
          case "${{ matrix.label }}" in
            windows-x64)
              cp "$(ls "$BUNDLE"/nsis/*.exe | head -n1)" "release/LumiLooks-$VERSION-Setup.exe" ;;
            macos-arm64)
              ditto -c -k --sequesterRsrc --keepParent "$BUNDLE/macos/LumiLooks.app" "release/LumiLooks-$VERSION-macos-arm64.zip" ;;
            macos-x64)
              ditto -c -k --sequesterRsrc --keepParent "$BUNDLE/macos/LumiLooks.app" "release/LumiLooks-$VERSION-macos-x64.zip" ;;
            linux-x64)
              cp "$(ls "$BUNDLE"/deb/*.deb | head -n1)" "release/lumilooks_${VERSION}_amd64.deb"
              cp "$(ls "$BUNDLE"/appimage/*.AppImage | head -n1)" "release/LumiLooks-$VERSION-linux-x86_64.AppImage" ;;
          esac
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: LumiLooks-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LumiLooks ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          body: |
            Téléchargements officiels : https://lumilooks.luminosweb.com

            - **Windows x64** : `LumiLooks-*-Setup.exe`
            - **macOS Apple Silicon / Intel** (macOS 13+) : `LumiLooks-*-macos-arm64.zip` / `LumiLooks-*-macos-x64.zip` — préversions signées ad hoc, non notarisées. Décompressez puis glissez LumiLooks.app dans Applications.
            - **Linux** : `lumilooks_*_amd64.deb` (Debian / Ubuntu) ou `LumiLooks-*-linux-x86_64.AppImage` (portable)

            Empreintes SHA-256 : `SHA256SUMS.txt`.
          files: release/*
