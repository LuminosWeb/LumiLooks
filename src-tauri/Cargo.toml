[package]
name = "lumilooks"
version = "2.0.1"
description = "LumiLooks — studio de looks et d'étalonnage photo et vidéo par LuminosWeb"
authors = ["LuminosWeb"]
license = "MIT"
repository = "https://github.com/LuminosWeb/LumiLooks"
homepage = "https://lumilooks.luminosweb.com"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lumilooks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
flate2 = "1"
percent-encoding = "2"
ureq = { version = "2", default-features = false, features = ["tls", "proxy-from-env"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
